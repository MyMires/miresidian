[package]
name = "miresidian"
version = "0.33.0"
edition.workspace = true
rust-version.workspace = true
description = "A Rust runtime for cross-language node plugins."
license.workspace = true
repository = "https://github.com/MyMires/miresidian"
documentation = "https://docs.rs/miresidian"
readme = "README.md"
autobins = false

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[workspace]
# 具体节点是框架外的独立项目；工作区仅包含框架库与配套开发工具。
members = ["abi", "codec", "features/format", "features/batch", "features/instance", "features/lease", "macro", "tools/miresidian-pack", "tools/miresidian-testflow-windows", "tools/miresidian-cli"]
default-members = [".", "codec", "features/format", "features/batch", "features/instance", "features/lease", "macro"]
resolver = "3"

[features]
default = []
# 节点通过 instance(...) 声明实例关联与多通道执行策略。
instance = ["miresidian_instance/runtime"]
# 跨 DLL 的通用本地 IPC 租约协调服务；节点只声明资源与配置字段。
lease = ["miresidian_lease/local-ipc"]
# 显式参数/输出格式转换；基础类型解析始终可用。
format = ["dep:miresidian_format"]
# 由参数级 batch 标记启用按原参数类型解析的顺序展开与结果聚合。
batch = ["dep:miresidian_batch"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
[dependencies]
miresidian_format = { version = "=0.4.1", path = "features/format", optional = true }
miresidian_abi = { version = "=0.17.1", path = "abi" }
miresidian_codec = { version = "=0.18.0", path = "codec" }
miresidian_macro = { version = "=0.29.0", path = "macro" }
miresidian_batch = { version = "=0.3.2", path = "features/batch", optional = true }
inventory = "=0.3.24"
serde_json = "1.0"
miresidian_lease = { version = "=0.17.4", path = "features/lease" }
serde = { version = "1.0", features = ["derive"] }

miresidian_instance = { version = "=0.17.0", path = "features/instance" }

tokio = { version = "~1.53.3", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
futures-util = "=0.3.31"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
trybuild = "1.0"

[[example]]
name = "execution_dll"
path = "examples/execution_dll.rs"
crate-type = ["cdylib"]
required-features = ["instance"]
test = false

# Internal loader validation fixture; its probe exports are not node C ABI.
[[example]]
name = "module_lifetime"
path = "examples/module_lifetime.rs"
crate-type = ["cdylib"]
test = false

[[example]]
name = "shared_resource_dll"
path = "examples/shared_resource_dll.rs"
crate-type = ["cdylib"]
required-features = ["lease", "instance"]
test = false

[[example]]
name = "other_resource_dll"
path = "examples/other_resource_dll.rs"
crate-type = ["cdylib"]
required-features = ["lease"]
test = false

[[example]]
name = "leased_resource_dll"
path = "examples/leased_resource_dll.rs"
crate-type = ["cdylib"]
required-features = ["lease", "instance"]
test = false

[[example]]
name = "leased_other_dll"
path = "examples/leased_other_dll.rs"
crate-type = ["cdylib"]
required-features = ["lease", "instance"]
test = false

[[example]]
name = "macro_shortcuts"
path = "examples/macro_shortcuts.rs"
crate-type = ["cdylib"]
required-features = ["instance", "lease", "format", "batch"]
test = false

[[example]]
name = "enum_platform_dll"
path = "examples/enum_platform_dll.rs"
crate-type = ["cdylib"]
test = false
