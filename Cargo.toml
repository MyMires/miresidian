[package]
name = "miresidian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust runtime for cross-language test-device nodes."
license.workspace = true
repository = "https://github.com/MyMires/miresidian"
readme = "README.md"
autobins = false

[lib]
crate-type = ["rlib"]

[workspace]
# 具体节点是框架外的独立项目；工作区仅包含框架库与配套开发工具。
members = ["abi", "codec", "lease", "macro", "tools/miresidian-pack", "tools/miresidian-testflow-windows"]
default-members = [".", "codec", "lease", "macro"]
resolver = "3"

[features]
# 跨 DLL 的通用本地 IPC 租约协调服务；节点只声明资源与配置字段。
lease = ["miresidian_lease/local-ipc"]

[workspace.package]
version = "0.11.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
[dependencies]
miresidian_abi = { version = "=0.11.1", path = "abi" }
miresidian_codec = { version = "=0.11.1", path = "codec" }
miresidian_macro = { version = "=0.11.1", path = "macro" }
serde_json = "1.0"
miresidian_lease = { version = "=0.11.1", path = "lease" }
serde = { version = "1.0", features = ["derive"] }
