[package]
name = "miresidian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust runtime for cross-language test-device nodes."
license.workspace = true
readme = "README.md"
autobins = false

[lib]
crate-type = ["rlib"]

[workspace]
# 具体节点是框架外的独立项目；工作区仅包含框架库与配套开发工具。
members = ["abi", "codec", "lease", "macro", "tools/miresidian-pack", "tools/miresidian-testflow-windows"]
default-members = [".", "codec", "lease", "macro"]
resolver = "3"

[features]
# 本地 IPC 与跨进程资源协调的通用基础；具体设备租约仍由节点 crate 实现。
lease = ["dep:miresidian_lease", "miresidian_lease/local-ipc"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
[dependencies]
miresidian_abi = { version = "=0.3.1", path = "abi" }
miresidian_codec = { version = "=0.3.1", path = "codec" }
miresidian_macro = { version = "=0.3.1", path = "macro" }
serde_json = "1.0"
miresidian_lease = { version = "=0.3.1", path = "lease", optional = true }
serde = { version = "1.0", features = ["derive"] }
