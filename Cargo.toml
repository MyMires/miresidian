[package]
name = "miresidian"
version.workspace = true
edition.workspace = true
description = "A Rust runtime for cross-language test-device nodes."
license.workspace = true

[lib]
crate-type = ["rlib"]

[workspace]
members = ["macros", "constellation/serial"]
default-members = ["constellation/serial"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
hex = "0.4"
miresidian-macros = { path = "macros" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0.117", features = ["full"] }
cargo_metadata = "0.19"
sha2 = "0.10"
