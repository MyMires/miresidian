[package]
name = "miresidian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust runtime for cross-language test-device nodes."
license.workspace = true
autobins = false

[lib]
crate-type = ["rlib"]

[package.metadata.miresidian]
abi_version = 5

[features]
# 节点开发者默认可直接使用 `#[miresidian::node]` 等属性宏；纯运行时使用者
# 可通过 `default-features = false` 避免编译过程宏依赖。
default = ["macros"]
macros = ["dep:miresidian_macros"]

[workspace]
# `constellation/*` 是基于框架的独立节点项目；工作区保留它们以便联调，
# 但框架的默认校验范围仅包含运行时与配套宏。
members = ["codec", "macros", "tools/miresidian-pack"]
exclude = ["constellation/serial"]
default-members = [".", "codec", "macros"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
[dependencies]
miresidian_codec = { version = "=0.2.0", path = "codec" }
miresidian_macros = { version = "=0.2.0", path = "macros", optional = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
