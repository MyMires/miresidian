[package]
name = "miresidian"
version = "0.14.1"
edition.workspace = true
rust-version.workspace = true
description = "A Rust runtime for cross-language test-device nodes."
license.workspace = true
repository = "https://github.com/MyMires/miresidian"
readme = "README.md"
autobins = false

[lib]
crate-type = ["rlib"]

[workspace]
# 具体节点是框架外的独立项目；工作区仅包含框架库与配套开发工具。
members = ["abi", "codec", "lease", "instances", "macro", "tools/miresidian-pack", "tools/miresidian-testflow-windows"]
default-members = [".", "codec", "lease", "instances", "macro"]
resolver = "3"

[features]
default = []
# 节点通过 instances(...) 声明实例关联与多通道执行策略。
instances = ["miresidian_instances/runtime"]
# 跨 DLL 的通用本地 IPC 租约协调服务；节点只声明资源与配置字段。
lease = ["miresidian_lease/local-ipc"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
[dependencies]
miresidian_abi = { version = "=0.14.0", path = "abi" }
miresidian_codec = { version = "=0.14.0", path = "codec" }
miresidian_macro = { version = "=0.14.0", path = "macro" }
inventory = "=0.3.24"
serde_json = "1.0"
miresidian_lease = { version = "=0.14.0", path = "lease" }
serde = { version = "1.0", features = ["derive"] }

miresidian_instances = { version = "=0.14.0", path = "instances" }

[dev-dependencies]
trybuild = "1.0"
