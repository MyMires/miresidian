[package]
name = "miresidian-serial"
version = "0.1.0"
edition = "2024"
description = "Miresidian 串口通信节点。"
license = "MIT OR Apache-2.0"

[lib]
# `cdylib` 是发布给测试平台的 DLL；`rlib` 仅供集成测试链接节点公开接口。
crate-type = ["cdylib", "rlib"]

[dependencies]
miresidian = { path = "../.." }
serialport = { version = "4.10.1", default-features = false }
