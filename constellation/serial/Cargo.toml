[package]
name = "miresidian_serial"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Miresidian 串口通信节点。"
license = "MIT OR Apache-2.0"

[lib]
# `cdylib` 是发布给测试平台的 DLL；`rlib` 仅供集成测试链接节点公开接口。
crate-type = ["cdylib", "rlib"]

[package.metadata.miresidian]
# 节点在本次发布中实际使用的框架与 C ABI 版本；打包前会自动校验。
miresidian_version = "0.2.0"
miresidian_abi_version = 5

[workspace]

[dependencies]
# 本地工作区联调使用 path；发布时 Cargo 会采用同一版本约束从 crates.io 解析框架。
miresidian = { version = "0.2.0", path = "../.." }
serialport = { version = "4.10.1", default-features = false }
