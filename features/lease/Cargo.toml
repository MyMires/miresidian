[package]
name = "miresidian_lease"
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
description = "Miresidian 通用跨进程资源租约协议与本地 IPC 基础。"
license.workspace = true
repository = "https://github.com/MyMires/miresidian"
readme = "README.md"

[features]
local-ipc = ["dep:interprocess", "dep:sha2", "dep:libc"]

[dependencies]
getrandom = "0.3"
miresidian_codec = { version = "=0.14.2", path = "../../codec" }
interprocess = { version = "2.4", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", optional = true }
