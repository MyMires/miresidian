[package]
name = "miresidian_macro"
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
description = "Miresidian 的设备节点属性过程宏。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MyMires/miresidian"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.117", features = ["full", "visit-mut"] }
proc-macro-crate = "3.2"
