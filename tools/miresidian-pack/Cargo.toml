[package]
name = "miresidian_pack"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
description = "Miresidian 节点发布包整理工具。"
license.workspace = true
repository = "https://github.com/MyMires/miresidian"
readme = "README.md"
keywords = ["miresidian", "cargo-subcommand", "windows", "ffi"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "cargo-miresidian-pack"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.19"
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0.117", features = ["full"] }
toml = "1.1.8"
