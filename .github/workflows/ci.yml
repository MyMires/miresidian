name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: P0 版本门禁回归
        run: python -m unittest discover -s tools/tests -v
      - name: P0 逐提交版本检查
        env:
          MIRESIDIAN_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_versions.py --base "$MIRESIDIAN_VERSION_BASE" --check-commits
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test -p miresidian --all-targets --features instances --locked
      - run: cargo test -p miresidian --all-targets --features lease --locked
      - run: cargo build --workspace --release --locked


  msrv:
    name: Rust 1.89 / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test -p miresidian_lease --all-targets --all-features --locked
      - run: cargo test -p miresidian --test panic_recovery --test lease_recovery --test response_contract --test method_registry --test init_outputs --test lease_initialization --test concurrent_execution --test concurrent_handles --test async_operations --test broadcast --all-features --locked
      - run: cargo build --example execution_dll --features instances --locked
      - if: runner.os == 'Linux'
        run: python3 tools/verify_runtime_dll.py target/debug/examples/libexecution_dll.so
      - if: runner.os == 'Windows'
        run: python tools/verify_runtime_dll.py target/debug/examples/execution_dll.dll
      - if: runner.os == 'Linux'
        run: |
          cargo build --example module_lifetime --locked
          python3 tools/verify_module_lifetime.py target/debug/examples/libmodule_lifetime.so

  windows-tools:
    name: Windows 工具端到端验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-gnu, i686-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-i686-gcc
      - name: 配置 MinGW 链接器
        shell: powershell
        run: |
          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          $cc64 = Join-Path $msysRoot 'mingw64\bin\gcc.exe'
          $cc32 = Join-Path $msysRoot 'mingw32\bin\gcc.exe'
          $dll64 = (Join-Path $msysRoot 'mingw64\bin\dlltool.exe').Replace('\', '/')
          $dll32 = (Join-Path $msysRoot 'mingw32\bin\dlltool.exe').Replace('\', '/')
          if (-not (Test-Path $cc64) -or -not (Test-Path $cc32)) { throw 'MinGW compiler missing' }
          if (-not (Test-Path $dll64) -or -not (Test-Path $dll32)) { throw 'MinGW dlltool missing' }
          (Split-Path $cc64) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Split-Path $cc32) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$cc64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=$cc32" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MIRESIDIAN_CC_X64=$cc64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MIRESIDIAN_CC_X86=$cc32" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS=-C dlltool={0}' -f $dll64) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('CARGO_TARGET_I686_PC_WINDOWS_GNU_RUSTFLAGS=-C dlltool={0}' -f $dll32) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 验证框架 DLL 模块引用与卸载（x64 / x86）
        shell: powershell
        run: |
          cargo build --example module_lifetime --locked --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'x64 模块夹具构建失败' }
          cargo build --example module_lifetime --locked --target i686-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'x86 模块夹具构建失败' }
          python tools/verify_module_lifetime.py target/x86_64-pc-windows-gnu/debug/examples/module_lifetime.dll --cc $env:MIRESIDIAN_CC_X64
          if ($LASTEXITCODE -ne 0) { throw 'x64 原生模块验证失败' }
          python tools/verify_module_lifetime.py target/i686-pc-windows-gnu/debug/examples/module_lifetime.dll --cc $env:MIRESIDIAN_CC_X86
          if ($LASTEXITCODE -ne 0) { throw 'x86 原生模块验证失败' }
      - name: 安装框架 Cargo 子命令
        shell: powershell
        run: |
          cargo install --path tools/miresidian-pack --locked --root "$env:RUNNER_TEMP\miresidian-tools" --force
          cargo install --path tools/miresidian-testflow-windows --locked --root "$env:RUNNER_TEMP\miresidian-tools" --force
          cargo install --path tools/miresidian-cli --root "$env:RUNNER_TEMP\miresidian-tools" --locked --force
          "$env:RUNNER_TEMP\miresidian-tools\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 打包并执行无硬件 TestFlow
        working-directory: tools/fixtures/smoke-node
        shell: powershell
        run: |
          cargo miresidian check
          if ($LASTEXITCODE -ne 0) { throw '统一项目/流程检查失败' }
          cargo miresidian build --arch x64
          if ($LASTEXITCODE -ne 0) { throw '统一独立构建失败' }
          cargo mires pack --arch all
          if ($LASTEXITCODE -ne 0) { throw '统一双位数打包失败' }
          cargo miresidian testflow --os windows tools/smoke.testflow
          if ($LASTEXITCODE -ne 0) { throw '统一 TestFlow 生成失败' }
          $env:MIRESIDIAN_TESTFLOW_NO_PAUSE = 1
          cmd.exe /d /c tools\smoke.bat
          if ($LASTEXITCODE -ne 0) { throw "TestFlow 失败，退出码：$LASTEXITCODE" }
          if (-not (Test-Path dist/工具冒烟节点/windows-x64/miresidian_tool_smoke_node.dll)) { throw '未生成 x64 DLL' }
          if (-not (Test-Path dist/工具冒烟节点/windows-x86/miresidian_tool_smoke_node.dll)) { throw '未生成 x86 DLL' }
      - name: 32 位宿主加载 DLL 并验证方法注册
        working-directory: tools/fixtures/smoke-node
        shell: powershell
        run: |
          $env:MIRESIDIAN_DLL_PATH = (Resolve-Path dist).Path
          $env:MIRESIDIAN_DLL_NAME = 'miresidian_tool_smoke_node.dll'
          $env:MIRESIDIAN_FLOW_FILE = (Resolve-Path tools/smoke.testflow).Path
          $env:MIRESIDIAN_FUNCTION = 'GetFunctions'
          $env:MIRESIDIAN_CONFIG_JSON = '[]'
          $env:MIRESIDIAN_INPUT_JSON = '[]'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tools/miresidian-testflow-windows/src/runner.ps1'
          $runner = Join-Path $env:RUNNER_TEMP 'miresidian-smoke-x86.ps1'
          Get-Content -Raw -Encoding utf8 $source | Set-Content -Encoding utf8 $runner
          & "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File $runner
          if ($LASTEXITCODE -ne 0) { throw "x86 注册烟测失败，退出码：$LASTEXITCODE" }
